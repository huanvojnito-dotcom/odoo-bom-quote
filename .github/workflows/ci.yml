name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 .
      - name: Tests unitarios (sin Odoo)
        run: pytest -v
