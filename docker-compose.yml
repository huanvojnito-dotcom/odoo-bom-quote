# Entorno de desarrollo: Odoo 17 + PostgreSQL 15
# Uso: docker compose up -d  ->  http://localhost:8069
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./component_bom_quote:/mnt/extra-addons/component_bom_quote
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
